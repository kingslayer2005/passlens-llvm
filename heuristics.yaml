# ============================================================================
# heuristics.yaml
# Features split into applicability (needed to fire) and cost_model (profitability).
# Directions are given for 'beneficial' (reduces size) and 'harmful' (increases size).
# ============================================================================

sroa:
  description: "Scalar Replacement of Aggregates"
  applicability:
    - name: alloca_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#sroa-scalar-replacement-of-aggregates"
      verified: true
    - name: load_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#sroa-scalar-replacement-of-aggregates"
      verified: true
    - name: store_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#sroa-scalar-replacement-of-aggregates"
      verified: true
  cost_model: []

instcombine:
  description: "Instruction Combining"
  applicability:
    - name: int_arith_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#instcombine-combine-instructions-to-form-fewer-simple-instructions"
      verified: true
    - name: cast_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#instcombine-combine-instructions-to-form-fewer-simple-instructions"
      verified: true
  cost_model: []

simplifycfg:
  description: "Control Flow Graph Simplification"
  applicability:
    - name: bb_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#simplifycfg-simplify-the-cfg"
      verified: true
    - name: uncond_br_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#simplifycfg-simplify-the-cfg"
      verified: true
    - name: cond_br_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#simplifycfg-simplify-the-cfg"
      verified: true
  cost_model: []

early-cse:
  description: "Early Common Subexpression Elimination"
  applicability:
    - name: load_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#early-cse-early-common-subexpression-elimination"
      verified: true
    - name: mean_insts_per_bb
      beneficial: high
      harmful: low
      source: "Larger blocks offer more local CSE opportunities"
      verified: false
  cost_model: []

gvn:
  description: "Global Value Numbering"
  applicability:
    - name: load_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#gvn-global-value-numbering"
      verified: true
  cost_model: []

sccp:
  description: "Sparse Conditional Constant Propagation"
  applicability:
    - name: const_operands_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#sccp-sparse-conditional-constant-propagation"
      verified: true
    - name: cond_br_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#sccp-sparse-conditional-constant-propagation"
      verified: true
  cost_model: []

adce:
  description: "Aggressive Dead Code Elimination"
  applicability:
    - name: store_density
      beneficial: low
      harmful: low
      source: "Fewer stores implies fewer side effects, meaning more dead code."
      verified: false
    - name: call_density
      beneficial: low
      harmful: low
      source: "Fewer calls implies fewer side effects."
      verified: false
  cost_model: []

dse:
  description: "Dead Store Elimination"
  applicability:
    - name: store_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#dse-dead-store-elimination"
      verified: true
  cost_model: []

reassociate:
  description: "Reassociate Expressions"
  applicability:
    - name: int_arith_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#reassociate-reassociate-expressions"
      verified: true
  cost_model: []

jump-threading:
  description: "Jump Threading"
  applicability:
    - name: cond_br_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#jump-threading-jump-threading"
      verified: true
  cost_model:
    - name: mean_insts_per_bb
      direction: threshold
      threshold: 6
      option: "jump-threading-threshold"
      source: "Small blocks are more likely to be threaded without exceeding duplication thresholds"
      verified: false

correlated-propagation:
  description: "Correlated Value Propagation"
  applicability:
    - name: icmp_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#correlated-propagation-correlated-value-propagation"
      verified: true
  cost_model: []

licm:
  description: "Loop Invariant Code Motion"
  applicability:
    - name: loop_count_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#licm-loop-invariant-code-motion"
      verified: true
    - name: load_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#licm-loop-invariant-code-motion"
      verified: true
  cost_model: []

loop-rotate:
  description: "Loop Rotation"
  applicability:
    - name: loop_count_density
      beneficial: high
      harmful: high
      source: "Loop rotate requires loops."
      verified: false
  cost_model:
    - name: max_loop_header_size
      direction: threshold
      threshold: 16
      option: "rotation-max-header-size"
      source: "Loop rotate duplicates the header block; small headers are preferred to minimize code growth."
      verified: false

indvars:
  description: "Induction Variable Simplification"
  applicability:
    - name: loop_count_density
      beneficial: high
      harmful: high
      source: "Requires loops."
      verified: false
    - name: phi_density
      beneficial: high
      harmful: high
      source: "Needs phi nodes for IVs."
      verified: false
  cost_model: []

loop-deletion:
  description: "Loop Deletion"
  applicability:
    - name: loop_count_density
      beneficial: high
      harmful: high
      source: "https://llvm.org/docs/Passes.html#loop-deletion-delete-dead-loops"
      verified: true
    - name: store_density
      beneficial: low
      harmful: low
      source: "https://llvm.org/docs/Passes.html#loop-deletion-delete-dead-loops"
      verified: true
  cost_model: []

loop-idiom:
  description: "Loop Idiom Recognition"
  applicability:
    - name: loop_count_density
      beneficial: high
      harmful: high
      source: "Requires loops."
      verified: false
    - name: store_density
      beneficial: high
      harmful: high
      source: "Requires stores for memset/memcpy recognition."
      verified: false
  cost_model: []

loop-unroll:
  description: "Loop Unrolling"
  applicability:
    - name: loop_count_density
      beneficial: high
      harmful: high
      source: "Requires loops."
      verified: false
  cost_model:
    - name: innermost_loop_body_size
      direction: threshold
      threshold: 150
      option: "unroll-threshold"
      source: "Loop unroll has a size threshold; large bodies are less likely to be fully unrolled or will increase size severely."
      verified: false

tailcallelim:
  description: "Tail Call Elimination"
  applicability:
    - name: call_density
      beneficial: high
      harmful: high
      source: "Requires calls."
      verified: false
    - name: self_recursive_call_density
      beneficial: high
      harmful: high
      source: "Commonly targets self-recursive tail calls."
      verified: false
  cost_model: []
